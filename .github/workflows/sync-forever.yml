name: Sync WoW Forever

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */6 * * *'

permissions:
  contents: write

concurrency:
  group: forever-profile-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install requests
      - name: Sync Forever character
        run: python scripts/sync_forever.py
      - name: Commit Forever data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forever/data.json
          if git diff --cached --quiet; then
            echo "No Forever data changes"
            exit 0
          fi
          git commit -m "Update WoW Forever character data"
          git pull --rebase origin main
          git push origin HEAD:main
