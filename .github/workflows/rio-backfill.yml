name: Backfill Raider.IO Mythic Plus
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backfill historical M+ seasons
        run: python scripts/rio_backfill.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Backfill historical Raider.IO Mythic+ runs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
